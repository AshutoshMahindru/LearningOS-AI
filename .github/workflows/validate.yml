name: Validate Learning OS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Validate repository
        run: python tools/validate_repo.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI closed-loop and dashboard smoke test
        run: |
          tmp=$(mktemp -d)
          cp -R data "$tmp/data"
          cp -R web "$tmp/web"
          mkdir -p "$tmp/tracking"
          printf '{"learner_id":"default","current_mission":null,"mission_status":{},"blockers":[]}' > "$tmp/tracking/learner_state.json"
          printf '{"learner_id":"default","current_mission":null,"autonomy_level":"A1","competencies":{},"misconceptions":[],"confidence":{},"retention_due":[],"open_side_quests":[],"evidence_summary":{},"gate_history":{},"autonomy_history":[]}' > "$tmp/tracking/learner_model.json"
          printf '[]' > "$tmp/tracking/evidence.json"
          printf '[]' > "$tmp/tracking/sessions.json"
          printf '{}' > "$tmp/tracking/competencies.json"
          printf '[]' > "$tmp/tracking/retention_events.json"
          printf '[]' > "$tmp/tracking/side_quests.json"
          printf '[]' > "$tmp/tracking/autonomy_events.json"
          learning-os --root "$tmp" dashboard | python -m json.tool > /dev/null
          learning-os --root "$tmp" start M01
          learning-os --root "$tmp" step
          learning-os --root "$tmp" evidence M01 --summary "smoke map" --competency "system mapping" --no-ai --transfer --explanation
          learning-os --root "$tmp" gate M01
          learning-os --root "$tmp" dashboard | python -m json.tool > /dev/null
          learning-os --root "$tmp" step
          learning-os --root "$tmp" learner-model
          learning-os --root "$tmp" autonomy status
      - name: CLI retrieval smoke test
        run: |
          learning-os resources M33 --blocker "embeddings semantic similarity"
          learning-os prereqs M34
          learning-os lab-status M01
          learning-os lab-status M19
          learning-os lab-status M20
          learning-os lab-status M21
          learning-os lab-status M22

  validate-missions-m01-m22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository and M01-M22 requirements
        run: |
          python -m pip install -e . \
            -r requirements/m01.txt -r requirements/m02.txt -r requirements/m03.txt \
            -r requirements/m04.txt -r requirements/m05.txt -r requirements/m06.txt \
            -r requirements/m07.txt -r requirements/m08.txt -r requirements/m09.txt \
            -r requirements/m10.txt -r requirements/m11.txt -r requirements/m12.txt \
            -r requirements/m13.txt -r requirements/m14.txt -r requirements/m15.txt \
            -r requirements/m16.txt -r requirements/m17.txt -r requirements/m18.txt \
            -r requirements/m19.txt -r requirements/m20.txt -r requirements/m21.txt \
            -r requirements/m22.txt
          python -m pip check
      - name: Validate repository
        run: python tools/validate_repo.py
      - name: Run full unittest discovery
        run: python -m unittest discover -s tests -v
      - name: Run full pytest suite
        run: python -m pytest -q tests
      - name: Validate and execute M01-M22 notebooks
        run: python tools/validate_mission_notebooks.py --execute
