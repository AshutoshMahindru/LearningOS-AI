name: Validate Learning OS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Validate repository
        run: python tools/validate_repo.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          tmp=$(mktemp -d)
          cp -R data "$tmp/data"
          mkdir -p "$tmp/tracking"
          learning-os --root "$tmp" start M01
          learning-os --root "$tmp" evidence M01 --summary "smoke map" --no-ai --transfer --explanation
          learning-os --root "$tmp" gate M01
          learning-os --root "$tmp" next
