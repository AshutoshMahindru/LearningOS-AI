name: LearningOS V3 Platform CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration/v3-g3-platform

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/backend/requirements.txt
      - run: python -m pip install -r platform/backend/requirements.txt pytest pytest-asyncio httpx
      - name: Backend tests
        working-directory: platform/backend
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install
        working-directory: platform/frontend
        run: npm ci
      - name: Lint
        working-directory: platform/frontend
        run: npm run lint
      - name: Type-check and build
        working-directory: platform/frontend
        run: npm run build

  frozen-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema>=4.19"
      - name: Cross-mission formal schema proof
        run: python architecture/learningos-v3/04_cross_mission_proof/schema_validator.py

  platform-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Launcher syntax
        run: bash -n start.sh
      - name: Reject learner state in platform paths
        run: |
          if find platform -type d -name tracking -o -type f -name learningos.db | grep -q .; then
            echo "Learner state detected under the Git platform worktree" >&2
            exit 1
          fi
      - name: Whitespace check
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check HEAD^
          fi
