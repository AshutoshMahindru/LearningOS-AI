name: LearningOS V3 Platform CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration/v3-g3-platform
      - integration/v3-g4-runtime
      - integration/v3-wp400
      - integration/v3-g5-reference

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r platform/backend/requirements.txt pytest pytest-asyncio httpx
      - name: Backend tests
        working-directory: platform/backend
        run: python -m pytest -q tests
      - name: Worker sandbox tests
        env:
          PYTHONPATH: platform/backend:platform/worker
        run: python -m pytest -q platform/worker/tests
      - name: Platform integration scenario
        env:
          PYTHONPATH: platform/backend
        run: python -m pytest --import-mode=importlib -q tests/platform/reference tests/platform/integration tests/platform/authoring

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install frontend
        working-directory: platform/frontend
        run: npm ci
      - name: Lint
        working-directory: platform/frontend
        run: npm run lint
      - name: Type-check and build
        working-directory: platform/frontend
        run: npm run build
      - name: Unit tests
        working-directory: platform/frontend
        run: npm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema>=4.19"
      - name: Cross-mission formal schema proof
        run: python architecture/learningos-v3/04_cross_mission_proof/schema_validator.py
      - name: Repository contract validation
        run: python tools/validate_repo.py
      - name: Platform Python static compile
        run: python -m compileall -q platform/backend/app platform/worker tools/platform tools/authoring

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Launcher syntax and help
        run: |
          bash -n start.sh
          ./start.sh --help
      - name: Tooling unit tests
        run: python -m unittest discover -s tests/platform/tooling -p 'test_*.py' -v
      - name: Reject learner state in the worktree
        run: python tools/platform/state_guard.py
      - name: Whitespace check
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^
          else
            git diff --check --cached
          fi

  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -r platform/backend/requirements.txt
      - name: Install frontend
        working-directory: platform/frontend
        run: npm ci
      - name: Start, probe, and cleanly stop the platform
        env:
          LEARNINGOS_HOME: ${{ runner.temp }}/learningos-home
        run: ./start.sh --smoke --timeout 60
      - name: Confirm learner state remains external
        run: python tools/platform/state_guard.py
