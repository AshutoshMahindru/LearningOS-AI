id: M02
title: Run and Interrogate Your First ML System
phase: P0
flagship: V00
objective: Run a complete supervised ML system before learning its internal mechanisms.
competencies:
  - ML system orientation
  - experimental reasoning
pedagogy: whole-first
formal_engineering_review: true
prerequisites:
  blocking:
    - M01
  helpful: []
learning_outcomes:
  - Map raw data, features, target, split, fit, predict, evaluation, and interrogation.
  - Change one experimental dimension at a time and compare evidence.
  - Distinguish an honest held-out metric from misleading evaluation.
  - Diagnose corrupted labels using data checks and comparative results.
whole_first_sequence:
  - raw data
  - features and target
  - train/test split
  - model fit
  - predictions
  - evaluation
  - interrogation
experiment_dimensions:
  - split
  - features
  - model
  - selected hyperparameters
  - labels
  - evaluation setup
controlled_failures:
  - corrupted training labels
  - invalid self-comparison evaluation
code_reading_boundaries:
  fit: baseline_model.fit
  prediction: baseline_model.predict
  evaluation: accuracy_score
no_ai_gate:
  mode: fresh supervised system run
  ai_assistance_allowed: false
  requires_interrogation_and_explanation: true
runtime:
  cpu_only: true
  requires_secrets: false
  requires_paid_api: false
  network_required: false
  deterministic_seed: 7
  restart_run_all_required: true
primary_artifact: labs/M02_first_ml_system.ipynb
dataset:
  path: datasets/M02/wine.csv
  provenance: scikit-learn packaged Wine recognition dataset, originating from the UCI Machine Learning Repository
  rows: 178
  feature_columns: 13
  target_column: target
requirements: requirements/m02.txt
test: tests/missions/test_m02.py
review_brief: missions/M02/review_brief.md
mission_artifacts:
  - missions/M02/manifest.yaml
  - missions/M02/README.md
  - missions/M02/content.yaml
  - missions/M02/experiments.yaml
  - missions/M02/code_reading.md
  - missions/M02/no_ai_gate.md
  - missions/M02/controlled_failure.md
  - missions/M02/assessment.yaml
  - missions/M02/evidence_contract.yaml
  - missions/M02/flagship_integration.md
  - missions/M02/status.yaml
  - missions/M02/review_brief.md
  - labs/M02_first_ml_system.ipynb
  - datasets/M02/README.md
  - datasets/M02/wine.csv
  - requirements/m02.txt
  - tests/missions/test_m02.py
constraints:
  learner_evidence_prepopulated: false
  shared_registry_edits_required: false
