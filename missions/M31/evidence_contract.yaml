mission_id: M31
version: 1
purpose: Define acceptable learner-produced LLM-training evidence without pre-populating learner results.
required_evidence:
  - id: prediction_log
    artifact_type: timestamped_experiment_notes
    must_show:
      - prediction_before_each_training_action
      - falsifiable_pair_loss_or_lineage_claim
      - observation_and_revision
  - id: next_token_pairs
    artifact_type: constructed_input_target_table
    must_show:
      - tokens_inputs_targets
      - correct_shift_identity
      - context_length_target_count
  - id: tiny_causal_loss
    artifact_type: nll_micro_case
    must_show:
      - hand_or_independent_softmax_nll
      - uniform_logits_baseline
  - id: train_eval_curves
    artifact_type: loss_table_or_plot
    must_show:
      - falling_train_objective_loss
      - held_out_true_next_token_nll
      - same_seed_and_budget
  - id: contamination_boundary
    artifact_type: split_lineage_report
    must_show:
      - authored_train_and_eval_ids
      - leaked_id_e02
      - eval_formula_unchanged
      - invalid_eval_claim
  - id: stage_map
    artifact_type: lifecycle_classification
    must_show:
      - pretraining
      - adaptation_or_post_training
      - evaluation
      - inference_not_a_weight_update
  - id: controlled_failure_diagnosis
    artifact_type: prediction_root_cause_repair_verification
    must_show:
      - named_shift_or_leak_defect
      - first_divergence_checkpoint
      - repair_from_broken_trace
      - regression_that_the_broken_path_still_diverges
  - id: code_reading_trace
    artifact_type: annotated_system_flow
    must_show:
      - m27_encode
      - shift_uses_tokens_slice
      - eval_correct_alignment
      - checkpoint_split_hash
  - id: no_ai_transfer
    artifact_type: independent_analysis_and_oral_defense
    conditions:
      - completed_without_ai_generated_code_calculations_or_prose
      - produced_from_blank_page
  - id: v07_training_provenance_adr
    artifact_type: learner_authored_architecture_decision_record
    must_show:
      - dataset_version
      - split_lineage
      - checkpoint_identity
      - adaptation_stage
      - minimum_audit_metadata
      - alternatives_and_trade_offs
      - owner_status_and_date
quality_bar:
  - Independent shift arithmetic matches programmatic inputs/targets.
  - Evaluation is treated as invalid under contamination.
  - Teaching-scale limits are explicit.
  - Future-mission mechanisms (decoding, temperature, RAG, tools) stay closed.
  - Failures are repaired by restoring alignment or authored train membership from the broken trace.
evidence_rules:
  require_observation_not_claim: true
  require_prediction_before_action: true
  require_transfer: true
  reviewer_signoff_required: true
  prefilled_learner_evidence: prohibited
