  - labs/M24_backpropagation.ipynb
  - requirements/m24.txt
  - tests/missions/test_m24.py
  - tests/test_m24.py
constraints:
  source_notebook_outputs: empty
  learner_evidence_prepopulated: false
  shared_registry_edits_required: false
  pytorch_autograd_deferred_to_m25: true
  training_loop_deferred_to_m25: true
  multi_cause_debugging_deferred_to_m26: true
