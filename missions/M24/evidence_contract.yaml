mission_id: M24
version: 1
purpose: Define acceptable learner-produced reverse-mode evidence without pre-populating learner results.
required_evidence:
  - id: prediction_log
    artifact_type: timestamped_experiment_notes
    must_show:
      - prediction_before_each_backprop_action
      - falsifiable_sign_value_or_mismatch_claim
      - observation_and_revision
  - id: m19_invariant
    artifact_type: worked_arithmetic
    must_show:
      - one_parameter_analytic_gradient
      - central_finite_difference
      - descent_update_convention
  - id: named_graph
    artifact_type: annotated_computational_graph
    must_show:
      - hidden_preactivation
      - hidden_activation
      - logits
      - probabilities
      - loss
      - reverse_order
  - id: scalar_chain
    artifact_type: hand_reverse_accumulation
    must_show:
      - local_derivatives
      - parameter_activation_and_loss_gradients
      - programmatic_agreement
  - id: branch_accumulation
    artifact_type: summed_path_contributions
    must_show:
      - each_downstream_contribution
      - equality_with_shared_node_gradient
  - id: activation_boundary
    artifact_type: relu_hinge_comparison
    must_show:
      - preactivation_negative_zero_gradient
      - preactivation_positive_nonzero_gradient
      - same_downstream_loss
  - id: finite_difference_check
    artifact_type: epsilon_sweep_versus_analytic
    must_show:
      - stable_check_region
      - truncation_or_roundoff_outside_it
      - relu_zero_hinge_caveat
  - id: one_step_update
    artifact_type: local_loss_movement
    must_show:
      - declared_parameter_only
      - downhill_loss
      - no_convergence_claim
  - id: controlled_failure_diagnosis
    artifact_type: prediction_root_cause_repair_verification
    must_show:
      - named_omitted_branch_or_wrong_relu_defect
      - first_finite_difference_mismatch
      - smallest_repair
      - preserved_invariants
  - id: code_reading_trace
    artifact_type: annotated_system_flow
    must_show:
      - stored_values
      - local_derivative_rules
      - reverse_topological_order
      - gradient_accumulation
      - gradient_reset_semantics
  - id: no_ai_transfer
    artifact_type: independent_analysis_and_oral_defense
    conditions:
      - completed_without_ai_generated_code_calculations_or_prose
      - produced_from_blank_page
  - id: gradient_verification_adr
    artifact_type: learner_authored_architecture_decision_record
    must_show:
      - parameters_and_cases_checked
      - tolerance_and_epsilon
      - when_checks_run
      - blocking_failures
      - owner_status_and_date
quality_bar:
  - Manual and programmatic gradients agree within tolerance on smooth parameters.
  - Claims cite named gradients rather than "backprop is working."
  - Future-mission mechanisms (framework autograd, training loops, multi-cause debugging) stay closed.
  - Failures are repaired by restoring the named local rule rather than changing several knobs.
evidence_rules:
  require_observation_not_claim: true
  require_prediction_before_action: true
  require_transfer: true
  reviewer_signoff_required: true
  prefilled_learner_evidence: prohibited
