id: M14
title: Discover Structure Without Labels
phase: P2
flagship: V03
objective: Use clustering to find structure without target labels.
competencies:
  - clustering
  - unsupervised reasoning
formal_engineering_review: true
adr_required: true
prerequisites:
  blocking:
    - M06
  helpful:
    - M15
whole_first_sequence:
  - inspect unlabelled observations
  - define the feature and distance contract
  - expose an unscaled K-means failure
  - standardize selected features
  - compare candidate values of k
  - inspect centers and within-cluster structure
  - stress arbitrary k, outliers, and visualization
  - interpret clusters without calling them true classes
execution:
  cpu_only: true
  deterministic_where_practical: true
  requires_secrets: false
  requires_paid_api: false
  network_required: false
  restart_run_all_required: true
primary_artifact: labs/M14_discover_structure_without_labels.ipynb
dataset:
  path: datasets/M14/learning_sessions.csv
  provenance: deterministic synthetic fixture authored for M14; no people or target labels
