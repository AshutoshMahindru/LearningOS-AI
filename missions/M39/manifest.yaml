id: M39
title: Add Memory, Routing, and Fallbacks
phase: P7
flagship: V10
phase_end: false
objective: Make an agentic system more robust through memory and control flow
competencies:
  - memory
  - routing
  - fallbacks
pedagogy: whole-system-first-prediction-before-action
formal_engineering_review: true
starts_flagship: false
prerequisites:
  blocking:
    - M38
  helpful: []
handoff:
  receives: M38 explicit workflow state, checkpointing, termination, approval, and tool execution
  provides: M40 receives a robust agent with declared memory, route, fallback, and trace surfaces that can be evaluated systematically
learning_sequence:
  - classify M38 state fields into ephemeral versus persistent candidates
  - add a provenance-bearing memory store
  - retrieve only relevant memory for a fixed task
  - create explicit routes for at least two task classes plus no-match
  - wrap the M38 workflow as the primary path
  - add one primary failure and a bounded fallback
  - add a reliable degraded terminal path
  - inject stale or superseded memory
  - inject repeated primary/fallback failure and verify no loop
  - diagnose stale-memory trust or fallback oscillation from traces
  - author the V10 memory/routing/fallback ADR
  - complete no-AI robustness design
runtime:
  cpu_only: true
  deterministic_where_practical: true
  requires_secrets: false
  requires_paid_api: false
  network_required: false
  restart_run_all_required: true
primary_artifact: labs/M39_memory_routing_fallbacks.ipynb
instrumentation: missions/M39/robust_agent.py
requirements: requirements/m39.txt
mission_test: tests/missions/test_m39.py
reference_fixture:
  robust_version: v10-teaching-robust-1
  seed: 3901
  catalog_sku: SKU-7
  catalog_price: 42.0
  stale_price: 99.0
  max_attempts: 3
  circuit_threshold: 2
  default_now: 1000
  weights_updated: false
  live_adapter: optional-not-required
