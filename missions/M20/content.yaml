mission: M20
boundary:
  inherited_from_m19: Gradients explain local loss change and the descent update.
  manipulated_here: Optimizer state, stochasticity, learning rate, and resulting dynamics.
  deferred_to_m21: End-to-end neural-network training and architecture internals.
handoff_summary: M19 explains gradients; M20 manipulates learning dynamics; M21 consumes the monitored training policy.
concepts:
  - learning rate scales each update but interacts with objective curvature
  - gradient descent uses the exact objective gradient
  - stochastic gradient descent trades smoothness for cheaper noisy component updates
  - momentum accumulates a velocity and may accelerate or overshoot
  - Adam adapts coordinate-wise steps using first and second moments
  - convergence is an observed approach toward a stable low-loss region
  - divergence is outward growth, not merely one bad step
  - oscillation is repeated crossing and can either decay or expand
  - optimizer rankings depend on objective, horizon, hyperparameters, and metric
objective:
  loss: 0.5 * (theta_0^2 + 10 * theta_1^2)
  gradient: [theta_0, 10 * theta_1]
  interpretation: Unequal curvature exposes direction-specific stability limits.
sequence_rule: Every experiment prediction must be recorded before its execution cell.
claims_boundary: Reference traces are fixture behavior, not universal optimizer rankings.
