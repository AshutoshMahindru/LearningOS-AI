mission: M32
boundary:
  inherited_from_m31: A produced language-model identity with training-time versus inference-time distinguished. StageAwareCheckpoint carries dataset version, split hash, objective, adaptation stage, seed, and inference_ready. Weights are frozen here.
  manipulated_here: Logits-to-token selection, greedy decoding, temperature, top-k/top-p teaching filters, seeds, stop/max-token controls, prompt/context effects, inference-config metadata as evidence, and adaptation choice among prompt, retrieval, tools, and parameter change as a decision rubric.
  deferred_to_m33: Semantic-search implementation, embedding indexes, query services.
  deferred_to_m34: RAG, citations, abstention, context packs, grounded generation.
  deferred_to_m37: Tool schemas, validation, execution, side effects.
handoff_summary: M31 supplies a stage-aware checkpoint and the training-time versus inference-time boundary. M32 hands M33/M34/M37 an InferenceConfig provider contract and an adaptation decision hierarchy. It does not hand them a retriever, a RAG pack, or a tool executor.
concepts:
  - inference converts token scores (logits) into selected tokens
  - greedy decoding is argmax and is invariant to temperature for T > 0
  - temperature rescales logits before softmax; it is not a quality knob
  - top-k and top-p truncate candidates and renormalize; they are not quality knobs
  - seed replay is a sampling claim that must be tested with other settings fixed
  - stop and max-tokens change termination, not the checkpoint
  - prompt/context changes the prefix that scores the next token
  - inference configuration is reproducibility evidence
  - adaptation hierarchy: prompt, retrieval, tools, parameters
  - fine-tuning is the wrong first response to a freshness problem
  - LoRA/QLoRA are named parameter-efficient options, not implementations here
sequence_rule: Every experiment prediction must be recorded before its execution cell.
claims_boundary: M32 may explain decoding, sampling controls, prompt/context effects, and a rubric for choosing prompt versus retrieval versus tools versus parameter change. It may not implement semantic search, RAG, or tool execution. It may not treat temperature or filters as isolated quality metrics. It may not claim the 4-token fixture is a production decoder. It may not mark a live model as required.
