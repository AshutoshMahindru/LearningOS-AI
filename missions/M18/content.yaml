interpretation_rules:
  - A point estimate is not a population truth.
  - A 95% confidence interval is a procedure with long-run coverage, not a 95% posterior probability that this fixed interval contains the parameter.
  - A p-value is not the probability that the null hypothesis is true.
  - Failure to reject is not proof of no effect.
  - Statistical significance does not establish practical importance or causality.
  - Comparison families and stopping rules must be defined before inspecting results.
