mission_id: M40
version: 1
purpose: Define acceptable learner-produced evaluation evidence without pre-populating learner results.
required_evidence:
  - id: prediction_log
    artifact_type: timestamped_experiment_notes
    must_show:
      - prediction_before_each_eval_action
      - falsifiable_case_id_or_gate_or_slice_or_version_claim
      - observation_and_revision
  - id: useful_whole
    artifact_type: end_to_end_suite_report
    must_show:
      - eval_version
      - case_ids
      - task_success_rate
      - invariant_pass
      - canonical_gate
  - id: deterministic_graders
    artifact_type: localized_grade_trace
    must_show:
      - tool_schema
      - citation_support
      - state_termination
      - idempotency
      - localized_failure
  - id: rubric_calibration
    artifact_type: disagreement_table
    must_show:
      - frozen_labels
      - disagreement_rate
      - deterministic_still_required
  - id: critical_slices
    artifact_type: slice_versus_aggregate
    must_show:
      - task_success_rate
      - critical_fail_rate
      - citation_or_schema_or_idempotency_slice
  - id: cost_proxies
    artifact_type: step_and_cost_table
    must_show:
      - step_count
      - cost_proxy
  - id: regression_injection
    artifact_type: unchanged_pack_gate_fail
    must_show:
      - named_m34_or_m37_m39_defect
      - eval_version_unchanged
      - canonical_gate_failed
  - id: trace_ablation
    artifact_type: field_removal_diagnosis
    must_show:
      - removed_field
      - blocked_diagnoses
  - id: controlled_failure_diagnosis
    artifact_type: prediction_root_cause_repair_verification
    must_show:
      - named_hidden_critical_or_contaminated_defect
      - rates_or_eval_version
      - repair_from_broken_trace
      - regression_that_the_broken_path_still_fails
  - id: code_reading_trace
    artifact_type: annotated_system_flow
    must_show:
      - versioned_load
      - deterministic_graders
      - slice_gate
      - fail_closed_judge
  - id: no_ai_transfer
    artifact_type: independent_analysis_and_oral_defense
    conditions:
      - completed_without_ai_generated_code_calculations_or_prose
      - produced_from_blank_page
  - id: v11_evaluation_governance_adr
    artifact_type: learner_authored_architecture_decision_record
    must_show:
      - dataset_ownership_versioning
      - grader_hierarchy
      - severities
      - regression_baseline
      - release_thresholds
      - human_review_triggers
      - audit_retention
      - owner_status_and_date
quality_bar:
  - Frozen pack case ids match the live harness.
  - Critical slices can fail a release independently of average score.
  - LLM-as-judge is not the sole required grader.
  - Future-mission mechanisms (M41 architecture diagram as a skill) stay closed.
  - Failures are repaired from the broken trace, not two unrelated happy-path runs.
  - V11 is not marked closed because the package exists.
evidence_rules:
  require_observation_not_claim: true
  require_prediction_before_action: true
  require_transfer: true
  reviewer_signoff_required: true
  prefilled_learner_evidence: prohibited
